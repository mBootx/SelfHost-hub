<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connexion SelfHost Hub</title>
<style>
:root{--bg:#0f1318;--panel:#171d25;--line:#2a3441;--fg:#e6eaf0;--mute:#8d99a8;--accent:#4aa3ff;--bad:#e5534b}
@media (prefers-color-scheme:light){:root{--bg:#f2f4f7;--panel:#fff;--line:#d9dfe7;--fg:#1b232d;--mute:#64707f;--accent:#0a6cd6;--bad:#c93a32}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.box{max-width:380px;margin:12vh auto 0;padding:0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mute);font-size:13px;overflow-wrap:anywhere}
label{display:block;margin:12px 0 4px;color:var(--mute);font-size:12px}
input{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{font:inherit;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;margin-top:16px}
button.ghost{background:none;color:var(--fg);border-color:var(--line)}button:disabled{opacity:.5;cursor:default}
.msg{margin-top:12px;color:var(--bad);min-height:1.4em}
.hidden{display:none}
.services{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.services h2{font-size:13px;color:var(--mute);margin:0 0 8px;font-weight:600}
.services ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="box">
  <div class="card" id="signin">
    <h1>Connexion</h1>
    <div class="sub" id="for">Avec votre compte Navidrome.</div>
    <form id="form" autocomplete="on">
      <label for="u">Utilisateur</label><input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="p">Mot de passe</label><input id="p" type="password" autocomplete="current-password" required>
      <button id="go" type="submit">Se connecter</button>
      <div class="msg" id="msg" role="alert"></div>
    </form>
  </div>
  <div class="card hidden" id="done">
    <h1>Connecté</h1>
    <div class="sub" id="who"></div>
    <div id="back"></div>
    <div id="services" class="services hidden"></div>
    <button class="ghost" id="out" type="button">Se déconnecter</button>
  </div>
</div>
<script>
"use strict";
// ---------- md5 (Subsonic token = md5(password + salt)), the same as the admin page ----------
function md5(str){
  const bytes=new TextEncoder().encode(str),n=bytes.length;
  const S=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21],K=new Int32Array(64);
  for(let i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)|0;
  const total=(((n+8)>>>6)+1)*64,buf=new Uint8Array(total);
  buf.set(bytes);buf[n]=0x80;
  const dv=new DataView(buf.buffer);
  dv.setUint32(total-8,(n*8)>>>0,true);dv.setUint32(total-4,Math.floor(n*8/4294967296),true);
  let a0=0x67452301|0,b0=0xefcdab89|0,c0=0x98badcfe|0,d0=0x10325476|0;
  for(let off=0;off<total;off+=64){
    let A=a0,B=b0,C=c0,D=d0;
    for(let i=0;i<64;i++){
      let F,g;
      if(i<16){F=(B&C)|(~B&D);g=i}
      else if(i<32){F=(D&B)|(~D&C);g=(5*i+1)%16}
      else if(i<48){F=B^C^D;g=(3*i+5)%16}
      else{F=C^(B|~D);g=(7*i)%16}
      F=(F+A+K[i]+dv.getInt32(off+g*4,true))|0;
      A=D;D=C;C=B;
      const s=S[(i>>4)*4+(i&3)];
      B=(B+((F<<s)|(F>>>(32-s))))|0;
    }
    a0=(a0+A)|0;b0=(b0+B)|0;c0=(c0+C)|0;d0=(d0+D)|0;
  }
  const out=new DataView(new ArrayBuffer(16));
  [a0,b0,c0,d0].forEach((w,i)=>out.setInt32(i*4,w,true));
  return Array.from(new Uint8Array(out.buffer),b=>b.toString(16).padStart(2,"0")).join("");
}
const MD5_VECTORS=[["","d41d8cd98f00b204e9800998ecf8427e"],["a","0cc175b9c0f1b6a831c399e269772661"],["abc","900150983cd24fb0d6963f7d28e17f72"],["message digest","f96b697d7cb7938d525a2f31aaf161d0"],["The quick brown fox jumps over the lazy dog","9e107d9d372bb6826bd81d3542a419d6"],["12345678901234567890123456789012345678901234567890123456789012345678901234567890","57edf4a22be3c955ac49da2e2107b67a"]];
const md5Ok=MD5_VECTORS.every(([s,h])=>md5(s)===h);
const $=s=>document.querySelector(s);
// Where to go back after signing in: Nginx puts the whole address after "rd=", its own query string included.
let rd="";
{const i=location.search.indexOf("rd=");if(i>=0){rd=location.search.slice(i+3);try{rd=decodeURIComponent(rd)}catch(e){}}}
const target=(()=>{try{const u=new URL(rd);return u.protocol==="https:"?u:null}catch(e){return null}})();
if(target)$("#for").textContent="Pour accéder à "+target.host+", connectez-vous avec votre compte Navidrome.";
async function api(path,body){
  const o={credentials:"same-origin",headers:{}};
  if(body!==undefined){o.method="POST";o.headers["Content-Type"]="application/json";o.headers["X-Requested-With"]="hub-admin";o.body=JSON.stringify(body)}
  const r=await fetch(path,o);let j=null;try{j=await r.json()}catch(e){}
  return {status:r.status,body:j};
}
function safeHttpUrl(raw){
  if(typeof raw!=="string")return null;
  try{
    const u=new URL(raw);
    return(u.protocol==="https:"||u.protocol==="http:")?u.href:null;
  }catch(e){return null}
}
function signedIn(user,services){
  $("#signin").classList.add("hidden");$("#done").classList.remove("hidden");
  $("#who").textContent="Compte Navidrome : "+user;
  const back=$("#back");back.textContent="";
  if(target){const p=document.createElement("p");const a=document.createElement("a");a.href=target.href;a.textContent="Continuer vers "+target.host;p.appendChild(a);back.appendChild(p)}
  const box=$("#services");box.textContent="";box.classList.add("hidden");
  if(Array.isArray(services)&&services.length>0){
    const list=document.createElement("ul");
    for(const s of services){
      if(!s||typeof s.name!=="string")continue;
      const href=safeHttpUrl(s.url);
      if(!href)continue;
      const li=document.createElement("li");
      const a=document.createElement("a");
      a.href=href;
      a.textContent=s.name;
      li.appendChild(a);
      list.appendChild(li);
    }
    if(list.children.length>0){
      const h=document.createElement("h2");
      h.textContent="Services";
      box.appendChild(h);
      box.appendChild(list);
      box.classList.remove("hidden");
    }
  }
}
const ERR={401:"Identifiants invalides.",429:"Trop de tentatives : réessayez dans 10 minutes.",502:"Navidrome est injoignable depuis le serveur.",400:"Requête refusée, réessayez."};
$("#form").addEventListener("submit",async e=>{
  e.preventDefault();const msg=$("#msg");msg.textContent="";
  if(!md5Ok){msg.textContent="Auto-test MD5 échoué : connexion désactivée.";return}
  $("#go").disabled=true;
  try{
    const c=await api("/api/admin/challenge");
    if(c.status!==200){msg.textContent=ERR[c.status]||"Erreur serveur.";return}
    const nonce=c.body.nonce,pw=$("#p").value;
    const r=await api("/api/gate/login",{user:$("#u").value.trim(),token:md5(pw+nonce),nonce,rd});
    if(r.status===200){
      $("#p").value="";
      if(r.body.redirect){location.replace(r.body.redirect);return}
      let services=[];
      try{const v=await api("/api/gate/verify");if(v.status===200&&v.body)services=v.body.services}catch(err){}
      signedIn(r.body.user,services);
    }
    else msg.textContent=ERR[r.status]||"Erreur serveur ("+r.status+").";
  }catch(err){msg.textContent="Serveur injoignable."}
  finally{$("#go").disabled=!md5Ok}
});
$("#out").addEventListener("click",async()=>{try{await api("/api/gate/logout",{})}catch(e){}location.reload()});
api("/api/gate/verify").then(r=>{if(r.status===200)signedIn(r.body.user,r.body.services);else $("#u").focus()}).catch(()=>{});
</script>
</body>
</html>
