<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Administration SelfHost Hub</title>
<style>
:root{--bg:#0f1318;--panel:#171d25;--panel2:#1e2631;--line:#2a3441;--fg:#e6eaf0;--mute:#8d99a8;--accent:#4aa3ff;--ok:#3fb67a;--warn:#e0a63a;--bad:#e5534b;--track:#2a3441}
@media (prefers-color-scheme:light){:root{--bg:#f2f4f7;--panel:#fff;--panel2:#f6f8fa;--line:#d9dfe7;--fg:#1b232d;--mute:#64707f;--accent:#0a6cd6;--ok:#1e8a58;--warn:#b57b0c;--bad:#c93a32;--track:#e3e8ee}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
body{min-height:100vh}
h1{font-size:18px;margin:0}h2{font-size:13px;margin:0 0 8px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
button{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)}button.sm{padding:2px 8px;font-size:12px}
input[type=text],input[type=password]{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:12px}
.login{max-width:360px;margin:12vh auto 0;padding:24px 16px}
.login .card{padding:20px}.login h1{margin-bottom:4px}
.msg{margin-top:12px;color:var(--bad);min-height:1.4em}
header.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{border-color:transparent;background:none;color:var(--mute)}
nav button.on{color:var(--fg);background:var(--panel2);border-color:var(--line)}
.who{display:flex;gap:10px;align-items:center;color:var(--mute)}
main{padding:16px;max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.big{font-size:30px;font-weight:650;line-height:1.1}
.sub{color:var(--mute);font-size:12px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin:6px 0;min-width:40px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.bar i.warn,.fill.warn{background:var(--warn)}.bar i.bad,.fill.bad{background:var(--bad)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
svg.spark{width:100%;height:46px;display:block;margin-top:6px}
svg.spark .l{fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke}
svg.spark .a{fill:var(--accent);opacity:.15;stroke:none}
svg.spark .l2{fill:none;stroke:var(--ok);stroke-width:1.6;vector-effect:non-scaling-stroke}
.cores{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:8px}
.cores div{font-size:11px;color:var(--mute)}.cores .bar{margin:2px 0;height:6px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
th{color:var(--mute);font-weight:600;font-size:12px;white-space:nowrap}
th.s{cursor:pointer;user-select:none}th.s.on{color:var(--accent)}
td.n{text-align:right;white-space:nowrap}th.n{text-align:right}
.tw{overflow-x:auto}
.note{padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--mute);background:var(--panel2)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}
.alert-bar{display:flex;flex-direction:column;gap:8px}
.alert-item{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.alert-item.critical{border-left-color:var(--bad)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;width:min(960px,100%);max-height:90vh;display:flex;flex-direction:column;gap:10px}
.modal-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.modal-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.modal-tools input[type=text]{width:220px;padding:5px 8px}
select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
#logbody{max-height:65vh;overflow:auto;margin:0}
.sec{margin-bottom:16px}.sec>h2{margin-top:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:6px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.mini{width:70px;display:inline-block;vertical-align:middle}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}.kv span:nth-child(odd){color:var(--mute)}
.hidden{display:none!important}
.upd{color:var(--mute);font-size:12px}
pre.key{white-space:pre-wrap;word-break:break-all;font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}
.qr svg{width:220px;height:220px;display:block;margin:8px 0;border-radius:8px}
.cf input{max-width:170px;letter-spacing:.25em;font-variant-numeric:tabular-nums}
.cf .row{justify-content:flex-start;align-items:center}
#xt{height:min(70vh,640px);margin-top:8px;background:#0b0e12;border-radius:8px;padding:4px;overflow:hidden}
svg.chart{width:100%;height:220px;display:block;background:var(--panel2);border:1px solid var(--line);border-radius:6px}
svg.chart.small{height:38px;border-radius:4px}svg.chart.core{height:70px}svg.chart.hist{height:90px}
svg.chart .gr line{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
svg.chart polyline{fill:none;stroke-width:1.8;vector-effect:non-scaling-stroke;stroke-linejoin:round}
svg.chart .l{stroke:var(--accent)}svg.chart .l2{stroke:var(--ok)}svg.chart .l3{stroke:#a371f7}svg.chart .l4{stroke:var(--warn)}
svg.chart .a{fill:var(--accent);opacity:.18}svg.chart .a2{fill:var(--ok);opacity:.15}svg.chart .a3{fill:#a371f7;opacity:.18}svg.chart .a4{fill:var(--warn);opacity:.18}
.perf{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px;align-items:start}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:6px 8px;border-radius:8px;background:none;border:1px solid transparent;width:100%}
.pitem.on{background:var(--panel2);border-color:var(--accent)}
.pitem b{display:block;font-size:13px;font-weight:600}.pitem span{display:block;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.phead h3{margin:0;font-size:22px;font-weight:600}.phead .sub{font-size:13px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin:3px 1px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px 18px;margin-top:14px}
.stats span{display:block;font-size:12px;color:var(--mute)}.stats b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.coregrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.coregrid .axis{margin-top:0}
.legend{display:inline-flex;gap:12px;font-size:12px;color:var(--mute)}.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.comp{display:flex;height:22px;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:12px}
.comp i{display:block;height:100%}
.ptools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:10px}
.ptools input[type=text]{max-width:360px}.ptools label{display:inline-flex;gap:6px;align-items:center;margin:0;font-size:13px;color:var(--fg)}
table.procs td,table.procs th{padding:4px 8px;white-space:nowrap}table.procs td{font-variant-numeric:tabular-nums}
table.procs td:first-child{max-width:340px;overflow:hidden;text-overflow:ellipsis}
table.procs th .tot{font-size:16px;color:var(--fg);font-weight:600}
table.procs tr.grp{cursor:pointer;background:var(--panel2)}table.procs td.ind{padding-left:28px}
table.procs tbody tr:hover{outline:1px solid var(--accent);outline-offset:-1px}
@media (max-width:760px){.perf{grid-template-columns:1fr}.plist{flex-direction:row;overflow-x:auto;padding-bottom:4px}.pitem{min-width:190px}}
@media (max-width:520px){main{padding:10px}.big{font-size:26px}th,td{padding:5px 4px}svg.chart{height:170px}}
</style>
</head>
<body>
<section id="login" class="login hidden">
  <div class="card">
    <h1>SelfHost Hub</h1>
    <div class="sub">Administration : compte Navidrome administrateur</div>
    <form id="form" autocomplete="on">
      <label for="u">Utilisateur</label><input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="p">Mot de passe</label><input id="p" type="password" autocomplete="current-password" required>
      <div style="margin-top:14px"><button class="primary" id="go" type="submit">Se connecter</button></div>
      <div class="msg" id="msg" role="alert"></div>
    </form>
  </div>
</section>

<section id="app" class="hidden">
  <header class="top">
    <h1>SelfHost Hub</h1>
    <nav id="nav"></nav>
    <div class="who"><span id="who"></span><span class="upd" id="upd"></span><button id="out" class="sm">Déconnexion</button></div>
  </header>
  <main>
    <div id="alerts" class="hidden" style="margin-bottom:12px"></div>
    <div id="view"></div>
    <div id="termv" class="hidden">
      <div id="tstat"></div>
      <div id="tbox" class="card hidden"><div class="row"><span id="tline" class="sub"></span><button class="sm danger" data-t="close">Fermer la session</button></div><div id="xt"></div></div>
      <div id="tmeta"></div>
    </div>
  </main>
  <div id="logmodal" class="modal-bg hidden" role="dialog" aria-modal="true" aria-labelledby="logname">
    <div class="modal">
      <div class="modal-head">
        <b id="logname">Logs</b>
        <div class="modal-tools">
          <select id="logtail" aria-label="Nombre de lignes"><option value="100">100 lignes</option><option value="200" selected>200 lignes</option><option value="500">500 lignes</option></select>
          <input id="logq" type="text" placeholder="Filtrer…" autocomplete="off" spellcheck="false">
          <button id="logref" class="sm">Actualiser</button>
          <button id="logcopy" class="sm">Copier</button>
          <button id="logclose" class="sm">Fermer</button>
        </div>
      </div>
      <pre id="logbody" class="key"></pre>
    </div>
  </div>
</section>

<script>
"use strict";
// ---------- md5 (Subsonic token = md5(password + salt)) ----------
function md5(str){
  const bytes=new TextEncoder().encode(str),n=bytes.length;
  const S=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21],K=new Int32Array(64);
  for(let i=0;i<64;i++)K[i]=Math.floor(Math.abs(Math.sin(i+1))*4294967296)|0;
  const total=(((n+8)>>>6)+1)*64,buf=new Uint8Array(total);
  buf.set(bytes);buf[n]=0x80;
  const dv=new DataView(buf.buffer);
  dv.setUint32(total-8,(n*8)>>>0,true);dv.setUint32(total-4,Math.floor(n*8/4294967296),true);
  let a0=0x67452301|0,b0=0xefcdab89|0,c0=0x98badcfe|0,d0=0x10325476|0;
  for(let off=0;off<total;off+=64){
    let A=a0,B=b0,C=c0,D=d0;
    for(let i=0;i<64;i++){
      let F,g;
      if(i<16){F=(B&C)|(~B&D);g=i}
      else if(i<32){F=(D&B)|(~D&C);g=(5*i+1)%16}
      else if(i<48){F=B^C^D;g=(3*i+5)%16}
      else{F=C^(B|~D);g=(7*i)%16}
      F=(F+A+K[i]+dv.getInt32(off+g*4,true))|0;
      A=D;D=C;C=B;
      const s=S[(i>>4)*4+(i&3)];
      B=(B+((F<<s)|(F>>>(32-s))))|0;
    }
    a0=(a0+A)|0;b0=(b0+B)|0;c0=(c0+C)|0;d0=(d0+D)|0;
  }
  const out=new DataView(new ArrayBuffer(16));
  [a0,b0,c0,d0].forEach((w,i)=>out.setInt32(i*4,w,true));
  return Array.from(new Uint8Array(out.buffer),b=>b.toString(16).padStart(2,"0")).join("");
}
const MD5_VECTORS=[["","d41d8cd98f00b204e9800998ecf8427e"],["a","0cc175b9c0f1b6a831c399e269772661"],["abc","900150983cd24fb0d6963f7d28e17f72"],["message digest","f96b697d7cb7938d525a2f31aaf161d0"],["The quick brown fox jumps over the lazy dog","9e107d9d372bb6826bd81d3542a419d6"],["12345678901234567890123456789012345678901234567890123456789012345678901234567890","57edf4a22be3c955ac49da2e2107b67a"]];
const md5Ok=MD5_VECTORS.every(([s,h])=>md5(s)===h);

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=(x,d=1)=>x==null||isNaN(x)?"?":Number(x).toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:0});
function bytes(b){if(b==null)return"?";const u=["o","Ko","Mo","Go","To"];let i=0,x=b;while(x>=1024&&i<4){x/=1024;i++}return nf(x,i>=3?2:i?1:0)+" "+u[i]}
const rate=b=>bytes(b)+"/s";
function dur(s){if(s==null)return"?";s=Math.floor(s);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d} j ${h} h`:h?`${h} h ${m} min`:`${m} min ${s%60} s`}
function ago(t){if(!t)return"jamais";const s=Math.max(0,Date.now()/1000-t);return s<60?"à l'instant":"il y a "+dur(s)}
const lvl=p=>p>=90?"bad":p>=70?"warn":"";
const clamp=p=>Math.max(0,Math.min(100,p||0));
const bar=(p,cls=lvl(p))=>`<div class="bar"><i class="${cls}" style="width:${clamp(p)}%"></i></div>`;
const note=t=>`<div class="note">${esc(t)}</div>`;
function spark(vals,max,cls="l"){
  const v=(vals||[]).map(x=>x==null?null:Number(x));
  if(v.filter(x=>x!=null).length<2)return `<svg class="spark" viewBox="0 0 100 30"></svg>`;
  const m=max||Math.max(1,...v.filter(x=>x!=null)),w=100/(Math.max(v.length-1,1));
  let pts=[];v.forEach((x,i)=>{if(x!=null)pts.push([i*w,30-Math.min(x,m)/m*28-1])});
  const line=pts.map(p=>p[0].toFixed(2)+","+p[1].toFixed(2)).join(" ");
  const area=`${pts[0][0]},30 ${line} ${pts[pts.length-1][0]},30`;
  return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none">${cls==="l"?`<polygon class="a" points="${area}"/>`:""}<polyline class="${cls}" points="${line}"/></svg>`;
}
function tempLevel(c,s){const hi=s&&s.high,cr=s&&s.crit;if(cr!=null&&c>=cr-5)return"bad";if(hi!=null&&c>=hi-5)return"warn";if(cr==null&&hi==null){return c>=85?"bad":c>=70?"warn":"ok"}return"ok"}

// ---------- state / api ----------
const TABS=[["perf","Performances"],["proc","Processus"],["svc","Conteneurs"],["disk","Disques"],["net","Réseau"],["hub","Hub"],["term","Terminal"]];
let tab="perf",sys=null,hub=null,sortKey="cpu",showVirtual=false,busy=false,timer=null,ticks=0;
try{tab=localStorage.getItem("hubAdminTab")||"perf";if(!TABS.some(t=>t[0]===tab))tab="perf"}catch(e){}
async function api(path,body){
  const o={credentials:"same-origin",headers:{}};
  if(body!==undefined){o.method="POST";o.headers["Content-Type"]="application/json";o.headers["X-Requested-With"]="hub-admin";o.body=JSON.stringify(body)}
  const r=await fetch(path,o);let j=null;try{j=await r.json()}catch(e){}
  return {status:r.status,body:j};
}
function show(app){$("#login").classList.toggle("hidden",app);$("#app").classList.toggle("hidden",!app);if(!app){stop();termClose();closeLogs();renderAlerts();$("#u").focus()}}

// ---------- login ----------
const ERR={401:"Identifiants invalides.",403:"Réservé aux administrateurs Navidrome",429:"Trop de tentatives : réessayez dans 10 minutes.",502:"Navidrome est injoignable depuis le serveur.",400:"Requête refusée, réessayez."};
$("#form").addEventListener("submit",async e=>{
  e.preventDefault();const msg=$("#msg");msg.textContent="";
  if(!md5Ok){msg.textContent="Auto-test MD5 échoué : connexion désactivée.";return}
  $("#go").disabled=true;
  try{
    const c=await api("/api/admin/challenge");
    if(c.status!==200){msg.textContent=ERR[c.status]||"Erreur serveur.";return}
    const nonce=c.body.nonce,pw=$("#p").value;
    const r=await api("/api/admin/login",{user:$("#u").value.trim(),token:md5(pw+nonce),nonce});
    if(r.status===200){$("#p").value="";enter(r.body.user)}
    else msg.textContent=ERR[r.status]||"Erreur serveur ("+r.status+").";
  }catch(err){msg.textContent="Serveur injoignable."}
  finally{$("#go").disabled=!md5Ok}
});
$("#out").addEventListener("click",async()=>{try{await api("/api/admin/logout",{})}catch(e){}sys=hub=null;show(false)});
function enter(user){$("#who").textContent=user;show(true);buildNav();applyTab();start()}
function applyTab(){
  const t=tab==="term";
  $("#view").classList.toggle("hidden",t);$("#termv").classList.toggle("hidden",!t);
  if(t){termRefresh();setTimeout(fitTerm,0)}else refresh();
}

// ---------- refresh loop ----------
// Every second, like Task Manager (the server samples every second while a panel is open); the Hub tab every 3 s.
function start(){stop();timer=setInterval(()=>{if(!document.hidden&&(tab!=="hub"||++ticks%3===0))refresh()},1000)}
function stop(){if(timer){clearInterval(timer);timer=null}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&timer)refresh()});
async function refresh(){
  if(busy||tab==="term")return;busy=true;
  try{
    const r=await api(tab==="hub"?"/api/admin/hub":tab==="proc"?"/api/admin/system?processes=1":"/api/admin/system");
    if(r.status===401){show(false);$("#msg").textContent="Session expirée.";return}
    if(r.status===200){if(tab==="hub")hub=r.body;else sys=r.body;$("#upd").textContent=new Date().toLocaleTimeString("fr-FR");render()}
  }catch(e){$("#upd").textContent="hors ligne"}
  finally{busy=false}
}
function buildNav(){
  $("#nav").innerHTML=TABS.map(([k,n])=>`<button data-tab="${k}" class="${k===tab?"on":""}">${n}</button>`).join("");
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;tab=b.dataset.tab;try{localStorage.setItem("hubAdminTab",tab)}catch(x){}buildNav();$("#view").innerHTML="";applyTab()});

// ---------- views ----------
const view=$("#view");
function renderAlerts(){
  const el=$("#alerts"),list=(sys&&Array.isArray(sys.alerts))?sys.alerts:[];
  if(!list.length){el.classList.add("hidden");el.innerHTML="";return}
  el.classList.remove("hidden");
  el.innerHTML=`<div class="alert-bar">${list.map(a=>{
    const crit=(a.level||a.severity)==="critical";
    const msg=a.message||a.text||a.label||a.id||"";
    const head=a.title&&a.title!==msg?`<b>${esc(a.title)}</b> `:"";
    return `<div class="alert-item ${crit?"critical":"warn"}"><div>${head}${esc(msg)}${a.detail?`<div class="sub">${esc(a.detail)}</div>`:""}</div><span class="tag ${crit?"bad":"warn"}">${crit?"Critique":"Attention"}</span></div>`;
  }).join("")}</div>`;
}
function render(){
  renderAlerts();
  if(tab==="hub"){if(hub)view.innerHTML=vHub();return}
  if(!sys)return;
  if(!sys.ready){view.innerHTML=note("Première mesure en cours, quelques secondes…");return}
  if(tab==="proc"){vProc();return}
  view.innerHTML=({perf:vPerf,svc:vSvc,disk:vDisk,net:vNet})[tab]();
}
function sec(title,inner){return `<div class="sec"><h2>${title}</h2>${inner}</div>`}
// ---------- performance (Task Manager style) ----------
let perfSel="cpu";
try{perfSel=localStorage.getItem("hubAdminPerf")||"cpu"}catch(e){}
const ghz=m=>m==null?"?":nf(m/1000,2)+" GHz";
// A line chart of the last `n` points, right-aligned like Task Manager (newest on the right).
function chart(series,max,opt={}){
  const N=opt.n||60,W=600,H=opt.small?60:opt.core?100:200;
  const vals=series.flatMap(s=>(s.v||[]).filter(x=>x!=null));
  const m=max||niceMax(Math.max(0,...vals));
  let g="";
  if(!opt.small){for(let i=1;i<10;i++)g+=`<line x1="${i*W/10}" y1="0" x2="${i*W/10}" y2="${H}"/>`;for(let i=1;i<4;i++)g+=`<line x1="0" y1="${i*H/4}" x2="${W}" y2="${i*H/4}"/>`}
  const paths=series.map(s=>{
    const v=(s.v||[]).slice(-N),off=N-v.length,pts=[];
    v.forEach((x,i)=>{if(x!=null)pts.push([(off+i)*W/(N-1),H-Math.min(x,m)/m*(H-2)-1])});
    if(pts.length<2)return"";
    const line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    return (s.fill?`<polygon class="${s.fill}" points="${pts[0][0].toFixed(1)},${H} ${line} ${pts[pts.length-1][0].toFixed(1)},${H}"/>`:"")+`<polyline class="${s.cls||"l"}" points="${line}"/>`;
  }).join("");
  return `<svg class="chart${opt.small?" small":""}${opt.core?" core":""}${opt.hist?" hist":""}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><g class="gr">${g}</g>${paths}</svg>`;
}
// A round top for rate charts: 1, 2 or 5 times a power of ten (in bytes/s, at least 10 Ko/s).
function niceMax(x){x=Math.max(x*1.1,10240);const p=Math.pow(10,Math.floor(Math.log10(x)));return [1,2,5,10].map(k=>k*p).find(v=>v>=x)}
const axisTop=(l,r)=>`<div class="axis"><span>${l}</span><span>${r}</span></div>`;
const axisBottom=(n,step)=>`<div class="axis"><span>${n*step>=120?nf(n*step/60,0)+" minutes":nf(n*step,0)+" secondes"}</span><span>0</span></div>`;
const stat=(k,v)=>`<div><span>${k}</span><b>${v}</b></div>`;
const legend=items=>`<span class="legend">${items.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join("")}</span>`;
function perfResources(){
  const L=sys.live||{},c=sys.cpu||{},m=sys.memory||{},io=sys.diskio||{},n=sys.network||{},t=sys.temps||{};
  const last=a=>a&&a.length?a[a.length-1]:0;
  const r=[];
  if(!c.unavailable)r.push({id:"cpu",name:"Processeur",val:`${nf(c.total,0)} %${c.freqMhz?" · "+ghz(c.freqMhz):""}`,s:[{v:L.cpu,cls:"l",fill:"a"}],max:100});
  if(!m.unavailable)r.push({id:"mem",name:"Mémoire",val:`${bytes(m.used)} / ${bytes(m.total)} (${nf(m.percent,0)} %)`,s:[{v:L.mem,cls:"l3",fill:"a3"}],max:100});
  if(!io.unavailable&&(io.devices||[]).length)r.push({id:"disk",name:"Disques",val:`${nf(last(L.busy),0)} % · ${rate(last(L.dr)+last(L.dw))}`,s:[{v:L.busy,cls:"l2",fill:"a2"}],max:100});
  if(!n.unavailable)r.push({id:"net",name:"Réseau",val:`↓ ${rate(last(L.rx))} · ↑ ${rate(last(L.tx))}`,s:[{v:L.rx,cls:"l4"},{v:L.tx,cls:"l"}]});
  if(!t.unavailable)r.push({id:"temp",name:"Température",val:`${nf(t.max)} °C`,s:[{v:L.temp,cls:"l4",fill:"a4"}],max:Math.max(100,t.max||0)});
  return r;
}
function vPerf(){
  const res=perfResources();
  if(!res.length)return note("Aucune mesure disponible : montez /proc et /sys de l'hôte, voir le README.");
  if(!res.some(x=>x.id===perfSel))perfSel=res[0].id;
  const list=res.map(x=>`<button class="pitem ${x.id===perfSel?"on":""}" data-perf="${x.id}">${chart(x.s,x.max,{small:true})}<div><b>${x.name}</b><span>${x.val}</span></div></button>`).join("");
  return `<div class="perf"><div class="plist">${list}</div><div class="card">${({cpu:pCpu,mem:pMem,disk:pDisk,net:pNet,temp:pTemp})[perfSel]()}</div></div>`;
}
function histBlock(series,max,label){
  const H=sys.history||{},n=(H.cpu||[]).length;
  if(n<2)return "";
  return `<h2 style="margin-top:18px">Dernière heure${label?" · "+label:""}</h2>${chart(series(H),max,{n:360,hist:true})}${axisBottom(360,H.step||10)}`;
}
function pCpu(){
  const c=sys.cpu,ho=sys.host||{},L=sys.live||{},l=ho.load||[];
  const cores=c.cores||[],perCore=cores.map((_,i)=>(L.cores||[]).map(p=>p&&p[i]!=null?p[i]:null));
  return `<div class="phead"><h3>Processeur</h3><span class="sub">${esc(c.model||"")}</span></div>
  ${axisTop("% d'utilisation","100 %")}${chart([{v:L.cpu,cls:"l",fill:"a"}],100)}${axisBottom(60,L.step||1)}
  <div class="stats">${stat("Utilisation",nf(c.total,0)+" %")}${stat("Vitesse",c.freqMhz?ghz(c.freqMhz):"?")}${stat("Vitesse max.",c.freqMaxMhz?ghz(c.freqMaxMhz):"?")}${stat("Processus",ho.processes??"?")}${stat("Threads",ho.threads??"?")}${stat("Cœurs logiques",ho.cores||"?")}${stat("Durée de fonctionnement",dur(ho.uptime))}${stat("Charge 1 / 5 / 15 min",l.length?l.map(x=>nf(x,2)).join(" · "):"?")}</div>
  <h2 style="margin-top:18px">Par cœur</h2><div class="coregrid">${perCore.map((v,i)=>`<div>${axisTop("Cœur "+i,nf(cores[i],0)+" %")}${chart([{v,cls:"l",fill:"a"}],100,{core:true})}</div>`).join("")}</div>
  ${histBlock(H=>[{v:H.cpu,cls:"l",fill:"a"}],100,"% d'utilisation")}`;
}
function pMem(){
  const m=sys.memory,L=sys.live||{};
  const used=m.used,cache=Math.min(m.buffersCache||0,m.available),free=Math.max(0,m.total-used-cache),pc=x=>(x/Math.max(m.total,1)*100).toFixed(2);
  return `<div class="phead"><h3>Mémoire</h3><span class="sub">${bytes(m.total)}</span></div>
  ${axisTop("Utilisation de la mémoire",bytes(m.total))}${chart([{v:L.mem,cls:"l3",fill:"a3"}],100)}${axisBottom(60,L.step||1)}
  <h2 style="margin-top:14px">Composition</h2><div class="comp" title="Utilisée · cache · libre"><i style="width:${pc(used)}%;background:#a371f7"></i><i style="width:${pc(cache)}%;background:#a371f755"></i><i style="width:${pc(free)}%"></i></div>
  <div style="margin-top:6px">${legend([["#a371f7","Utilisée"],["#a371f755","Cache (récupérable)"],["var(--track)","Libre"]])}</div>
  <div class="stats">${stat("Utilisée",bytes(used)+" ("+nf(m.percent,0)+" %)")}${stat("Disponible",bytes(m.available))}${stat("Cache et tampons",bytes(m.buffersCache))}${stat("Libre",bytes(free))}${stat("Swap",m.swapTotal?bytes(m.swapUsed)+" / "+bytes(m.swapTotal):"aucun")}</div>
  ${histBlock(H=>[{v:H.mem,cls:"l3",fill:"a3"}],100,"% utilisée")}`;
}
function pDisk(){
  const io=sys.diskio,L=sys.live||{},last=a=>a&&a.length?a[a.length-1]:0;
  const space=((sys.disks||{}).items||[]);
  const rows=io.devices.map(d=>{const parts=space.filter(s=>(s.device||"").replace(/^\/dev\//,"").startsWith(d.name));
    return `<tr><td><b>${esc(d.name)}</b><div class="sub">${parts.map(p=>esc(p.mountpoint)).join(", ")||"–"}</div></td><td class="n">${nf(d.busy,0)} %<div class="mini">${bar(d.busy)}</div></td><td class="n">${rate(d.readRate)}</td><td class="n">${rate(d.writeRate)}</td><td class="n sub">${parts.length?bytes(parts.reduce((a,p)=>a+p.used,0))+" / "+bytes(parts.reduce((a,p)=>a+p.total,0)):""}</td></tr>`}).join("");
  const rw=[{v:L.dr,cls:"l2"},{v:L.dw,cls:"l"}],top=niceMax(Math.max(0,...(L.dr||[]),...(L.dw||[])));
  return `<div class="phead"><h3>Disques</h3><span class="sub">${io.devices.length} disque(s)</span></div>
  ${axisTop("Temps d'activité (disque le plus occupé)","100 %")}${chart([{v:L.busy,cls:"l2",fill:"a2"}],100)}${axisBottom(60,L.step||1)}
  <div style="margin-top:12px">${axisTop(legend([["var(--ok)","Lecture"],["var(--accent)","Écriture"]]),rate(top))}</div>${chart(rw,top,{core:true})}${axisBottom(60,L.step||1)}
  <div class="stats">${stat("Temps d'activité",nf(last(L.busy),0)+" %")}${stat("Lecture",rate(last(L.dr)))}${stat("Écriture",rate(last(L.dw)))}</div>
  <div class="tw" style="margin-top:14px"><table><thead><tr><th>Disque</th><th class="n">Activité</th><th class="n">Lecture</th><th class="n">Écriture</th><th class="n">Occupé</th></tr></thead><tbody>${rows}</tbody></table></div>
  ${histBlock(H=>[{v:H.busy,cls:"l2",fill:"a2"}],100,"temps d'activité")}`;
}
function pNet(){
  const L=sys.live||{},last=a=>a&&a.length?a[a.length-1]:0,top=niceMax(Math.max(0,...(L.rx||[]),...(L.tx||[])));
  const ifs=((sys.network||{}).interfaces||[]).filter(i=>!i.virtual);
  return `<div class="phead"><h3>Réseau</h3><span class="sub">${ifs.map(i=>esc(i.name)).join(", ")||"aucune interface physique"}</span></div>
  ${axisTop(legend([["var(--warn)","Réception"],["var(--accent)","Émission"]]),rate(top))}${chart([{v:L.rx,cls:"l4"},{v:L.tx,cls:"l"}],top)}${axisBottom(60,L.step||1)}
  <div class="stats">${stat("Réception",rate(last(L.rx)))}${stat("Émission",rate(last(L.tx)))}${ifs.map(i=>stat(esc(i.name)+" · total",bytes(i.rxTotal)+" ↓ · "+bytes(i.txTotal)+" ↑")).join("")}</div>
  ${histBlock(H=>[{v:H.rx,cls:"l4"},{v:H.tx,cls:"l"}],0,"débit")}`;
}
function pTemp(){
  const t=sys.temps,L=sys.live||{},hot=t.sensors.filter(s=>s.celsius===t.max)[0],top=Math.max(100,t.max||0);
  return `<div class="phead"><h3>Température</h3><span class="sub">${esc(hot?hot.chip+" · "+hot.label:"")}</span></div>
  ${axisTop("Capteur le plus chaud",nf(top,0)+" °C")}${chart([{v:L.temp,cls:"l4",fill:"a4"}],top)}${axisBottom(60,L.step||1)}
  <div class="stats">${t.sensors.map(s=>stat(esc(s.chip)+" · "+esc(s.label),`<span class="${tempLevel(s.celsius,s)}" style="display:inline;font-size:inherit">${nf(s.celsius)} °C</span>`)).join("")}</div>
  ${histBlock(H=>[{v:H.temp,cls:"l4",fill:"a4"}],top,"max.")}`;
}

// ---------- containers ----------
function vSvc(){
  const k=sys.containers||{};
  if(k.configured===false)return sec("Conteneurs",note("Conteneurs : non configuré (définissez DOCKER_URL, voir le README)."));
  let out=k.unavailable?note(k.unavailable):"";
  const items=[...(k.items||[])];
  const key={cpu:x=>-(x.cpu??-1),mem:x=>-(x.memUsed??-1),net:x=>-((x.rxRate??0)+(x.txRate??0)),io:x=>-((x.readRate??0)+(x.writeRate??0)),name:x=>x.name.toLowerCase()}[sortKey]||(x=>x.name.toLowerCase());
  items.sort((a,b)=>key(a)<key(b)?-1:key(a)>key(b)?1:0);
  const hostMem=sys.memory&&sys.memory.total||0;
  const run=items.filter(c=>c.state==="running"),sum=f=>run.reduce((a,c)=>a+(c[f]||0),0);
  const th=(id,t,n,tot)=>`<th class="s ${n?"n ":""}${sortKey===id?"on":""}" data-sort="${id}">${tot!=null?`<div style="font-size:15px;color:var(--fg)">${tot}</div>`:""}${t}${sortKey===id?" ▾":""}</th>`;
  const rows=items.map(c=>{
    const on=c.state==="running",lim=c.memLimit>0&&(!hostMem||c.memLimit<=hostMem)?c.memLimit:hostMem;
    const mp=on&&lim?c.memUsed/lim*100:0;
    return `<tr><td><b>${esc(c.name)}</b><div class="sub">${esc(c.image)}${c.project?" · "+esc(c.project):""}</div></td><td><span class="tag ${on?"ok":"bad"}">${esc(c.state)}</span><div class="sub">${esc(c.status)}</div></td><td class="n">${on&&c.cpu!=null?nf(c.cpu)+" %":"–"}${on&&c.cpu!=null?`<div class="mini">${bar(c.cpu)}</div>`:""}</td><td class="n">${on&&c.memUsed!=null?bytes(c.memUsed):"–"}${on?`<div class="mini">${bar(mp)}</div>`:""}</td><td class="n sub">${on&&c.rxRate!=null?"↓ "+rate(c.rxRate)+"<br>↑ "+rate(c.txRate):""}</td><td class="n sub">${on&&c.readRate!=null?"L "+rate(c.readRate)+"<br>É "+rate(c.writeRate):""}</td><td class="n sub">${on&&c.pids!=null?c.pids:""}</td><td class="n"><button class="sm" data-logs="${esc(c.id)}" data-cname="${esc(c.name)}">Logs</button></td></tr>`;
  }).join("");
  out+=`<div class="card tw"><table><thead><tr>${th("name","Conteneur")}<th>État</th>${th("cpu","CPU",1,nf(sum("cpu"),0)+" %")}${th("mem","Mémoire",1,bytes(sum("memUsed")))}${th("net","Réseau",1)}${th("io","Disque",1)}<th class="n">PID</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="8" class="sub">Aucun conteneur.</td></tr>`}</tbody></table></div>`;
  return sec(`Conteneurs : ${run.length} en marche sur ${items.length} (actualisés toutes les 2 s, CPU en % de toute la machine)`,out);
}

// ---------- processes ----------
let pSort="cpu",pDir=-1,pFilter="",pKernel=false,pGroup=false;const pOpen=new Set();
try{pGroup=localStorage.getItem("hubAdminGroup")==="1"}catch(e){}
function vProc(){
  if(!$("#ptools")){
    view.innerHTML=`<div id="ptools" class="ptools"><input id="pq" type="text" placeholder="Rechercher : nom, PID, utilisateur, conteneur, commande" value="${esc(pFilter)}" autocomplete="off" spellcheck="false"><label><input type="checkbox" id="pg" ${pGroup?"checked":""}> Regrouper par conteneur</label><label><input type="checkbox" id="pk" ${pKernel?"checked":""}> Threads du noyau</label><span class="sub" id="pcount"></span></div><div id="ptable" class="card tw"></div>`;
  }
  const P=sys.processes;
  if(!P||P.unavailable){$("#ptable").innerHTML=note(P&&P.unavailable||"Lecture des processus…");return}
  const cn={};((sys.containers||{}).items||[]).forEach(c=>cn[c.id]=c.name);
  const total=sys.memory&&sys.memory.total||0,ho=sys.host||{};
  const q=pFilter.trim().toLowerCase();
  let rows=P.items.filter(p=>pKernel||!p.kernel).map(p=>Object.assign({},p,{cname:p.container?(cn[p.container]||p.container):""}));
  if(q)rows=rows.filter(p=>(p.name+" "+p.pid+" "+(p.user||"")+" "+p.cname+" "+p.cmd).toLowerCase().includes(q));
  const keyf={name:p=>p.name.toLowerCase(),pid:p=>p.pid,user:p=>(p.user||"").toLowerCase(),ctr:p=>p.cname.toLowerCase(),cpu:p=>p.cpu,mem:p=>p.rss,thr:p=>p.threads}[pSort];
  const cmp=(a,b)=>{const x=keyf(a),y=keyf(b);return (x<y?-1:x>y?1:0)*pDir||a.pid-b.pid};
  const heat=v=>v>0.05?` style="background:rgba(74,163,255,${Math.min(.5,.06+v/100*1.5).toFixed(3)})"`:"";
  const memPct=r=>total?r/total*100:0;
  const th=(id,label,n,tot)=>`<th class="s ${n?"n ":""}${pSort===id?"on":""}" data-psort="${id}">${tot!=null?`<div class="tot">${tot}</div>`:""}${label}${pSort===id?(pDir<0?" ▾":" ▴"):""}</th>`;
  const row=(p,ind)=>`<tr title="${esc(p.cmd||p.name)}"><td${ind?' class="ind"':""}>${esc(p.name)}${p.state==="Z"?' <span class="tag bad">zombie</span>':""}</td><td class="n sub">${p.pid}</td><td class="sub">${esc(p.user??"?")}</td><td class="sub">${esc(p.cname)}</td><td class="n"${heat(p.cpu)}>${nf(p.cpu)} %</td><td class="n"${heat(memPct(p.rss))}>${bytes(p.rss)}</td><td class="n sub">${p.threads}</td></tr>`;
  let body;
  if(pGroup){
    const groups=new Map();
    rows.forEach(p=>{const k=p.cname||"";if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)});
    const g=[...groups].map(([k,list])=>({k,list:list.sort(cmp),name:k||"Hôte (hors conteneurs)",pid:list.length,user:"",cname:k,cpu:list.reduce((a,p)=>a+p.cpu,0),rss:list.reduce((a,p)=>a+p.rss,0),threads:list.reduce((a,p)=>a+p.threads,0)}));
    g.sort(cmp);
    body=g.map(x=>{const open=pOpen.has(x.k)||!!q;
      return `<tr class="grp" data-grp="${esc(x.k)}"><td><b>${open?"▾":"▸"} ${esc(x.name)}</b> <span class="sub">(${x.list.length})</span></td><td></td><td></td><td></td><td class="n"${heat(x.cpu)}><b>${nf(x.cpu)} %</b></td><td class="n"${heat(memPct(x.rss))}><b>${bytes(x.rss)}</b></td><td class="n sub">${x.threads}</td></tr>`+(open?x.list.map(p=>row(p,true)).join(""):"")}).join("");
  }else body=rows.sort(cmp).map(p=>row(p,false)).join("");
  $("#ptable").innerHTML=`<table class="procs"><thead><tr>${th("name","Nom")}${th("pid","PID",1)}${th("user","Utilisateur")}${th("ctr","Conteneur")}${th("cpu","CPU",1,nf(sys.cpu&&sys.cpu.total,0)+" %")}${th("mem","Mémoire",1,nf(sys.memory&&sys.memory.percent,0)+" %")}${th("thr","Threads",1)}</tr></thead><tbody>${body||`<tr><td colspan="7" class="sub">Aucun processus.</td></tr>`}</tbody></table>`;
  $("#pcount").textContent=`${rows.length} affichés · ${ho.processes??"?"} processus · ${ho.threads??"?"} threads · CPU en % de toute la machine`;
}
view.addEventListener("input",e=>{if(e.target.id==="pq"){pFilter=e.target.value;if(sys)vProc()}});
view.addEventListener("change",e=>{
  if(e.target.id==="pk"){pKernel=e.target.checked;if(sys)vProc()}
  if(e.target.id==="pg"){pGroup=e.target.checked;try{localStorage.setItem("hubAdminGroup",pGroup?"1":"0")}catch(x){}if(sys)vProc()}
});
view.addEventListener("click",e=>{
  const pb=e.target.closest("button[data-perf]");
  if(pb){perfSel=pb.dataset.perf;try{localStorage.setItem("hubAdminPerf",perfSel)}catch(x){}render();return}
  const ps=e.target.closest("th[data-psort]");
  if(ps){const k=ps.dataset.psort;if(pSort===k)pDir=-pDir;else{pSort=k;pDir=["cpu","mem","thr"].includes(k)?-1:1}vProc();return}
  const gr=e.target.closest("tr[data-grp]");
  if(gr){const k=gr.dataset.grp;pOpen.has(k)?pOpen.delete(k):pOpen.add(k);vProc()}
});
function vDisk(){
  const d=sys.disks;if(!d||d.unavailable)return sec("Disques",note((d&&d.unavailable)||"Indisponible")+"");
  if(!d.items.length)return sec("Disques",note("Aucun système de fichiers lisible. Montez / de l'hôte (HOST_ROOT), voir le README."));
  return sec("Disques",`<div class="grid">${d.items.map(x=>`<div class="card"><div class="row"><b>${esc(x.mountpoint)}</b><span class="tag">${esc(x.fstype)}</span></div><div class="sub">${esc(x.device)}</div>${bar(x.percent)}<div class="row"><span>${nf(x.percent)} %</span><span class="sub">${bytes(x.used)} / ${bytes(x.total)} · libre ${bytes(x.free)}</span></div></div>`).join("")}</div>`);
}
function vNet(){
  const n=sys.network||{},h=sys.history||{};
  let out=n.unavailable?note(n.unavailable):"";
  const list=(n.interfaces||[]).filter(i=>showVirtual||!i.virtual);
  out+=`<div class="grid"><div class="card"><h2>Réception</h2>${spark(h.rx,0)}<div class="sub">dernière valeur : ${rate((h.rx||[]).slice(-1)[0]||0)}</div></div><div class="card"><h2>Émission</h2>${spark(h.tx,0,"l2")}<div class="sub">dernière valeur : ${rate((h.tx||[]).slice(-1)[0]||0)}</div></div></div>`;
  out+=`<div class="sec" style="margin-top:12px"><label style="display:inline"><input type="checkbox" id="virt" ${showVirtual?"checked":""}> Afficher les interfaces virtuelles</label></div>`;
  out+=`<div class="card tw"><table><thead><tr><th>Interface</th><th class="n">↓ Réception</th><th class="n">↑ Émission</th><th class="n">Total ↓ / ↑</th></tr></thead><tbody>${list.map(i=>`<tr><td>${esc(i.name)} ${i.virtual?'<span class="tag">virtuelle</span>':""}</td><td class="n">${rate(i.rxRate)}</td><td class="n">${rate(i.txRate)}</td><td class="n sub">${bytes(i.rxTotal)} / ${bytes(i.txTotal)}</td></tr>`).join("")||`<tr><td colspan="4" class="sub">Aucune interface.</td></tr>`}</tbody></table></div>`;
  return sec("Réseau de l'hôte",out);
}
function vHub(){
  const s=hub.server,nv=hub.navidrome;
  const nvs=nv.ok==null?`<span class="tag">pas encore testé</span>`:nv.ok?`<span class="tag ok">joignable</span>`:`<span class="tag bad">injoignable</span>`;
  let out=`<div class="card" style="margin-bottom:12px"><div class="kv"><span>Serveur</span><span>${esc(s.name)} · v${esc(s.version)}</span><span>En marche depuis</span><span>${dur(s.uptime)}</span><span>Navidrome</span><span>${esc(nv.url)} ${nvs}${nv.checkedAt?` <span class="sub">(${ago(nv.checkedAt)})</span>`:""}</span><span>Base de données</span><span>${hub.dbBytes==null?"?":bytes(hub.dbBytes)}</span></div></div>`;
  if(hub.backups){
    const bk=hub.backups,items=bk.items||[];
    const rows=items.map(b=>`<tr><td>${esc(b.name)}</td><td class="n">${bytes(b.bytes)}</td><td class="n sub">${ago(b.createdAt)}</td></tr>`).join("");
    const st=bk.enabled?`Actives · ${bk.keep??"?"} conservées`:"Désactivées";
    out+=`<div class="card" style="margin-bottom:12px"><div class="row" style="margin-bottom:8px"><div><h2 style="margin:0">Sauvegardes (hub.db)</h2><div class="sub">${esc(st)}</div></div><button class="sm primary" data-backup="1">Sauvegarder maintenant</button></div>${items.length?`<div class="tw"><table><thead><tr><th>Fichier</th><th class="n">Taille</th><th class="n">Date</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="sub">Aucune sauvegarde pour l’instant.</div>'}<div class="msg" id="bkmsg" style="margin-top:6px;min-height:0"></div></div>`;
  }
  if(!hub.users.length)return out+note("Aucun utilisateur connu pour l'instant.");
  out+=hub.users.map(u=>{
    const names={};u.known.forEach(d=>names[d.deviceId]=d.deviceName);u.online.forEach(d=>names[d.deviceId]=d.deviceName);
    const on=u.online.map(d=>{const st=d.state;const now=st&&st.title?`${st.isPlaying?"▶":"⏸"} ${esc(st.title)}${st.artist?" · "+esc(st.artist):""}`:'<span class="sub">rien</span>';
      return `<tr><td><span class="dot ok"></span><b>${esc(d.deviceName)}</b><div class="sub">${esc(d.platform)} · ${esc(d.deviceId)}</div></td><td>${esc(d.ip)}<div class="sub">depuis ${ago(d.connectedAt)}</div></td><td>${now}</td><td class="n"><button class="sm danger" data-kick="${esc(d.deviceId)}" data-user="${esc(u.user)}" data-name="${esc(d.deviceName)}">Déconnecter</button></td></tr>`}).join("");
    const kn=u.known.map(d=>`<tr><td>${esc(d.deviceName)}<div class="sub">${esc(d.deviceId)}</div></td><td>${esc(d.platform)}</td><td class="n sub">${ago(d.lastSeen)}</td></tr>`).join("");
    const li=u.listening.map(d=>`<tr><td>${esc(names[d.deviceId]||d.deviceId)}</td><td class="n">${d.weeks}</td><td class="n">${nf(d.totalSeconds/3600)} h</td><td class="n sub">${d.rev}</td></tr>`).join("");
    return `<div class="card" style="margin-bottom:12px"><div class="row"><h2 style="margin:0;font-size:15px;color:var(--fg);text-transform:none">${esc(u.user)}</h2><span class="sub">${u.online.length} en ligne</span></div>
    <h2 style="margin-top:12px">En ligne</h2>${on?`<div class="tw"><table><thead><tr><th>Appareil</th><th>Adresse</th><th>Lecture</th><th></th></tr></thead><tbody>${on}</tbody></table></div>`:'<div class="sub">Aucun appareil en ligne.</div>'}
    <h2 style="margin-top:12px">Appareils connus</h2>${kn?`<div class="tw"><table><thead><tr><th>Appareil</th><th>Type</th><th class="n">Dernière vue</th></tr></thead><tbody>${kn}</tbody></table></div>`:'<div class="sub">Aucun.</div>'}
    <h2 style="margin-top:12px">Données d'écoute</h2>${li?`<div class="tw"><table><thead><tr><th>Appareil</th><th class="n">Semaines</th><th class="n">Écouté</th><th class="n">Rév.</th></tr></thead><tbody>${li}</tbody></table></div>`:'<div class="sub">Aucune donnée.</div>'}</div>`}).join("");
  return out;
}
let logCid="",logLines=[];
function closeLogs(){logCid="";logLines=[];$("#logmodal").classList.add("hidden")}
function renderLogs(){
  const q=$("#logq").value.trim().toLowerCase();
  const L=q?logLines.filter(l=>l.toLowerCase().includes(q)):logLines;
  $("#logbody").textContent=L.length?L.join("\n"):(logLines.length?"Aucune ligne ne correspond au filtre.":"Aucun log.");
}
async function loadLogs(){
  if(!logCid)return;
  const cid=logCid,tail=$("#logtail").value||"200";
  $("#logbody").textContent="Chargement…";
  try{
    const r=await api(`/api/admin/containers/${encodeURIComponent(cid)}/logs?tail=${encodeURIComponent(tail)}`);
    if(cid!==logCid)return;
    if(r.status===401){closeLogs();show(false);$("#msg").textContent="Session expirée.";return}
    if(r.status!==200){logLines=[];$("#logbody").textContent=(r.body&&r.body.error)||`Erreur (${r.status}).`;return}
    logLines=Array.isArray(r.body)?r.body:(r.body&&Array.isArray(r.body.lines)?r.body.lines:[]);
    renderLogs();
  }catch(x){if(cid===logCid)$("#logbody").textContent="Serveur injoignable."}
}
function openLogs(id,name){
  logCid=id;logLines=[];
  $("#logname").textContent="Logs · "+(name||id);
  $("#logq").value="";
  $("#logmodal").classList.remove("hidden");
  loadLogs();
}
$("#logtail").addEventListener("change",loadLogs);
$("#logref").addEventListener("click",loadLogs);
$("#logq").addEventListener("input",renderLogs);
$("#logclose").addEventListener("click",closeLogs);
$("#logmodal").addEventListener("click",e=>{if(e.target.id==="logmodal")closeLogs()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&logCid)closeLogs()});
$("#logcopy").addEventListener("click",async()=>{
  const b=$("#logcopy");
  try{await navigator.clipboard.writeText($("#logbody").textContent);b.textContent="Copié";setTimeout(()=>{b.textContent="Copier"},1500)}
  catch(x){b.textContent="Copie impossible"}
});
view.addEventListener("click",async e=>{
  const th=e.target.closest("th[data-sort]");if(th){sortKey=th.dataset.sort;render();return}
  const lb=e.target.closest("button[data-logs]");if(lb){openLogs(lb.dataset.logs,lb.dataset.cname||lb.dataset.logs);return}
  const bk=e.target.closest("button[data-backup]");
  if(bk){
    bk.disabled=true;
    try{
      const r=await api("/api/admin/backup",{});
      if(r.status===401){show(false);return}
      if(r.status!==200){const m=$("#bkmsg");if(m)m.textContent="Échec de la sauvegarde ("+r.status+")."}
      else await refresh();
    }catch(x){const m=$("#bkmsg");if(m)m.textContent="Serveur injoignable."}
    finally{bk.disabled=false}
    return;
  }
  const b=e.target.closest("button[data-kick]");if(!b)return;
  if(!confirm(`Déconnecter « ${b.dataset.name} » (${b.dataset.user}) ? L'appareil se reconnectera tout seul.`))return;
  b.disabled=true;
  const r=await api("/api/admin/disconnect",{user:b.dataset.user,deviceId:b.dataset.kick});
  if(r.status===401){show(false);return}
  if(r.status!==200)alert(r.status===404?"Cet appareil n'est plus en ligne.":"Échec ("+r.status+").");
  refresh();
});
view.addEventListener("change",e=>{if(e.target.id==="virt"){showVirtual=e.target.checked;render()}});

// ---------- terminal (SSH to the host, behind TOTP) ----------
let tinfo=null,term=null,fit=null,sock=null,xtLoaded=null,tUntil=0,lastReason="";
const enc=new TextEncoder();
const CODE_ERR={"bad-code":"Code incorrect.","code-required":"Entrez d'abord le code actuel.","too-many-attempts":"Trop de tentatives : réessayez dans 10 minutes.","totp-not-set":"La double authentification n'est pas configurée.","no-pending-setup":"Configuration expirée, recommencez.","db-error":"Erreur de base de données.","qr-error":"Impossible de générer le QR code."};
const SH_ERR={"ssh-unreachable":"Serveur SSH de l'hôte injoignable.","hostkey-mismatch":"La clé SSH de l'hôte a changé : connexion refusée.","ssh-auth-failed":"L'hôte refuse la clé du hub : ajoutez-la dans authorized_keys.","ssh-error":"Erreur SSH."};
const REASON={"closed-by-client":"fermée","closed-by-host":"fermée par l'hôte","session-ended":"session admin terminée","server-shutdown":"arrêt du serveur","max-duration":"durée maximale atteinte","idle-timeout":"inactivité","ssh-error":"erreur SSH","shell-disabled":"terminal désactivé"};
const reasonText=r=>!r?"":r.startsWith("connect-failed:")?"échec : "+(SH_ERR[r.slice(15)]||r.slice(15)):(REASON[r]||r);
function codeErr(r){
  const e=r.body&&r.body.error;
  if(r.status===401){show(false);$("#msg").textContent=e==="session-destroyed"?"Trop de codes faux : session fermée.":"Session expirée.";return ""}
  let t=CODE_ERR[e]||("Erreur ("+r.status+").");
  if(e==="bad-code"&&r.body.attemptsLeft!=null)t+=` Encore ${r.body.attemptsLeft} essai(s).`;
  return t;
}
const codeForm=(kind,label)=>`<form data-f="${kind}" class="cf" autocomplete="off"><label for="tcode">${label}</label><div class="row"><input id="tcode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required><button class="primary" type="submit">Valider</button></div><div class="msg" id="tmsg" role="alert"></div></form>`;
function loadXterm(){
  if(xtLoaded)return xtLoaded;
  const add=(tag,attrs)=>new Promise((res,rej)=>{const el=document.createElement(tag);Object.assign(el,attrs);el.onload=res;el.onerror=rej;document.head.appendChild(el)});
  xtLoaded=add("link",{rel:"stylesheet",href:"/admin/vendor/xterm.css"}).then(()=>add("script",{src:"/admin/vendor/xterm.js"})).then(()=>add("script",{src:"/admin/vendor/addon-fit.js"}));
  xtLoaded.catch(()=>{xtLoaded=null});
  return xtLoaded;
}
function fitTerm(){if(fit&&!$("#tbox").classList.contains("hidden")&&!$("#termv").classList.contains("hidden"))try{fit.fit()}catch(x){}}
window.addEventListener("resize",fitTerm);
async function termRefresh(){
  let r;
  try{r=await api("/api/admin/shell/info")}catch(x){$("#tstat").innerHTML=note("Serveur injoignable.");return}
  if(r.status===401){show(false);$("#msg").textContent="Session expirée.";return}
  if(r.status!==200){$("#tstat").innerHTML=note("Erreur ("+r.status+").");return}
  tinfo=r.body;tUntil=tinfo.elevatedFor?Date.now()+tinfo.elevatedFor*1000:0;
  renderTerm();
  try{const a=await api("/api/admin/shell/audit");if(a.status===200)renderAudit(a.body.sessions)}catch(x){}
}
function renderTerm(){
  const i=tinfo;let h="";
  if(sock)h="";
  else if(!i.enabled)h=`<div class="card">${note("Terminal désactivé. Dans deploy/docker-compose.yml, définissez SHELL_ENABLED: \"true\" et SHELL_SSH_USER, ajoutez la clé ci-dessous dans ~/.ssh/authorized_keys de cet utilisateur sur l'hôte, puis relancez le hub.")}</div>`;
  else if(!i.totp)h=`<div class="card"><h2>Double authentification</h2><div class="sub">Le terminal demande un code TOTP (Aegis, 2FAS, Google Authenticator…). À configurer une seule fois.</div><div style="margin-top:10px"><button class="primary" data-t="setup">Configurer</button></div><div class="msg" id="tmsg" role="alert"></div></div>`;
  else if(!tUntil||tUntil<=Date.now())h=`<div class="card"><h2>Déverrouiller le terminal</h2>${codeForm("unlock","Code à 6 chiffres de votre application")}</div>`;
  else h=`<div class="card"><div class="row"><span>Déverrouillé encore <b id="tleft">${dur((tUntil-Date.now())/1000)}</b></span><button class="primary" data-t="open">Ouvrir le terminal</button></div><div class="sub" style="margin-top:6px">${esc(i.sshUser)}@${esc(i.host)}:${i.port} · ${i.active}/${i.max} session(s) ouverte(s) · fermeture après ${dur(i.idleSeconds)} d'inactivité, ${dur(i.maxSeconds)} au plus</div><div class="msg" id="tmsg" role="alert"></div></div>`;
  $("#tstat").innerHTML=h;
  const f=$("#tcode");if(f)f.focus();
  $("#tmeta").innerHTML=`<div class="card" style="margin-top:12px"><h2>Clé SSH du hub</h2><div class="sub">Ligne à ajouter dans ~/.ssh/authorized_keys de « ${esc(i.sshUser||"SHELL_SSH_USER")} » sur l'hôte :</div><pre class="key">${esc(i.authorizedKey||"clé indisponible")}</pre>${i.authorizedKey?`<button class="sm" data-t="copy">Copier</button>`:""}<div class="kv sub" style="margin-top:8px"><span>Empreinte</span><span>${esc(i.keyFingerprint||"?")}</span><span>Clé de l'hôte</span><span>${i.hostKey?esc(i.hostKey):"pas encore épinglée (au premier accès)"}</span></div>${i.totp?`<div style="margin-top:10px"><button class="sm" data-t="rotate">Changer le secret 2FA</button></div>`:""}</div><div id="taudit"></div>`;
}
function renderAudit(rows){
  const R=rows||[],el=$("#taudit");if(!el)return;
  el.innerHTML=`<div class="card tw" style="margin-top:12px"><h2>Sessions récentes</h2>${R.length?`<table><thead><tr><th>Début</th><th>Utilisateur</th><th>Adresse</th><th class="n">Durée</th><th class="n">Envoyé / reçu</th><th>Fin</th></tr></thead><tbody>${R.map(s=>`<tr><td>${new Date(s.startedAt*1000).toLocaleString("fr-FR")}</td><td>${esc(s.user)}</td><td>${esc(s.ip)}</td><td class="n">${s.endedAt?dur(s.endedAt-s.startedAt):'<span class="ok">en cours</span>'}</td><td class="n sub">${bytes(s.bytesIn)} / ${bytes(s.bytesOut)}</td><td class="sub">${esc(reasonText(s.endReason))}</td></tr>`).join("")}</tbody></table>`:'<div class="sub">Aucune session.</div>'}</div>`;
}
function showSetup(b){
  $("#tstat").innerHTML=`<div class="card"><h2>Scannez ce QR code avec votre application</h2><div class="qr">${b.qrSvg}</div><div class="sub">Ou entrez la clé à la main : <code>${esc(b.secret)}</code></div>${codeForm("confirm","Puis le code qu'elle affiche")}</div>`;
  $("#tcode").focus();
}
setInterval(()=>{
  if(tab!=="term"||!tinfo||sock||!tUntil)return;
  const left=(tUntil-Date.now())/1000,el=$("#tleft");
  if(left<=0){tUntil=0;renderTerm();renderAuditLater()}else if(el)el.textContent=dur(left);
},1000);
function renderAuditLater(){api("/api/admin/shell/audit").then(a=>{if(a.status===200)renderAudit(a.body.sessions)}).catch(()=>{})}
$("#termv").addEventListener("submit",async e=>{
  const f=e.target.closest("form[data-f]");if(!f)return;e.preventDefault();
  const kind=f.dataset.f,code=$("#tcode").value,btn=f.querySelector("button");btn.disabled=true;
  const path={unlock:"/api/admin/shell/unlock",confirm:"/api/admin/totp/confirm",rotate:"/api/admin/totp/setup"}[kind];
  try{
    const r=await api(path,{code});
    if(r.status===200){if(kind==="rotate")showSetup(r.body);else await termRefresh();return}
    const t=codeErr(r);if(t&&$("#tmsg")){$("#tmsg").textContent=t;$("#tcode").select()}
  }catch(x){if($("#tmsg"))$("#tmsg").textContent="Serveur injoignable."}
  finally{btn.disabled=false}
});
$("#termv").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-t]");if(!b)return;
  const k=b.dataset.t;
  if(k==="setup"){
    b.disabled=true;
    try{const r=await api("/api/admin/totp/setup",{});if(r.status===200)showSetup(r.body);else{const t=codeErr(r);if(t)$("#tmsg").textContent=t}}
    catch(x){$("#tmsg").textContent="Serveur injoignable."}
    finally{b.disabled=false}
  }else if(k==="rotate"){$("#tstat").innerHTML=`<div class="card"><h2>Changer le secret 2FA</h2>${codeForm("rotate","Code actuel de votre application")}</div>`;$("#tcode").focus()}
  else if(k==="open")termOpen();
  else if(k==="close")termClose();
  else if(k==="copy"){try{await navigator.clipboard.writeText(tinfo.authorizedKey);b.textContent="Copié"}catch(x){b.textContent="Copie impossible : sélectionnez le texte"}}
});
async function termOpen(){
  if(sock)return;
  try{await loadXterm()}catch(x){if($("#tmsg"))$("#tmsg").textContent="Impossible de charger le terminal.";return}
  $("#tbox").classList.remove("hidden");$("#tstat").innerHTML="";
  if(!term){
    term=new Terminal({cursorBlink:true,fontSize:14,fontFamily:'ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace',scrollback:5000,theme:{background:"#0b0e12"}});
    fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open($("#xt"));
    term.onData(d=>{if(sock&&sock.readyState===1)sock.send(enc.encode(d))});
    term.onBinary(d=>{if(sock&&sock.readyState===1)sock.send(Uint8Array.from(d,c=>c.charCodeAt(0)&255))});
    term.onResize(({cols,rows})=>{if(sock&&sock.readyState===1)sock.send(JSON.stringify({type:"resize",cols,rows}))});
  }else term.reset();
  fitTerm();
  lastReason="";$("#tline").textContent="Connexion…";
  const ws=new WebSocket(`${location.protocol==="https:"?"wss:":"ws:"}//${location.host}/api/admin/shell/ws?cols=${term.cols}&rows=${term.rows}`);
  ws.binaryType="arraybuffer";sock=ws;
  ws.onmessage=ev=>{
    if(typeof ev.data!=="string"){term.write(new Uint8Array(ev.data));return}
    let j;try{j=JSON.parse(ev.data)}catch(x){return}
    if(j.type==="ready"){$("#tline").textContent=`${tinfo.sshUser}@${tinfo.host}`;fitTerm();term.focus()}
    else if(j.type==="error"){$("#tline").textContent=SH_ERR[j.code]||j.message;term.write(`\r\n\x1b[31m${j.message}\x1b[0m\r\n`)}
    else if(j.type==="closed")lastReason=j.reason;
  };
  ws.onclose=()=>{
    if(sock!==ws)return;sock=null;
    term.write(`\r\n\x1b[90m[session terminée : ${reasonText(lastReason)||"connexion refusée ou perdue"}]\x1b[0m\r\n`);
    $("#tline").textContent="Session fermée";
    if(!$("#app").classList.contains("hidden"))termRefresh();
  };
}
function termClose(){if(sock)try{sock.close()}catch(x){}}

// ---------- start ----------
(async()=>{
  if(!md5Ok){$("#go").disabled=true;$("#msg").textContent="Auto-test MD5 échoué : connexion désactivée."}
  try{
    const r=await api("/api/admin/me");
    if(r.status===200)enter(r.body.user);else show(false);
  }catch(e){show(false);$("#msg").textContent="Serveur injoignable."}
  if(!md5Ok)$("#msg").textContent="Auto-test MD5 échoué : connexion désactivée.";
})();
</script>
