plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.selfhostnative'
version = '1.0.0'

android {
  namespace "expo.modules.selfhostnative"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // The equalizer attaches to each expo-audio player's audio session. expo-audio is built from
  // source (see buildFromSource in package.json), so its Gradle project exists to depend on.
  implementation project(':expo-audio')
  // expo-audio keeps Media3 private; this only lets us compile against ExoPlayer (same version).
  compileOnly "androidx.media3:media3-exoplayer:1.9.0"
  // The Wear OS data layer: how the phone hands the watch app its setup (WatchBridge.kt).
  implementation "com.google.android.gms:play-services-wearable:19.0.0"
  // The car mode's hand tracking (HandTracker.kt): the front camera through CameraX, read by MediaPipe's hand
  // landmarker on the phone (its model is assets/hand_landmarker.task). MediaPipe's usage statistics to Google are
  // switched off in AndroidManifest.xml.
  def camerax = "1.5.3"
  implementation "androidx.camera:camera-core:$camerax"
  implementation "androidx.camera:camera-camera2:$camerax"
  implementation "androidx.camera:camera-lifecycle:$camerax"
  implementation "androidx.camera:camera-view:$camerax"
  implementation "com.google.mediapipe:tasks-vision:1.0.0"
}
