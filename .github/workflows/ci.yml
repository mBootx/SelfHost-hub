name: CI

# Type checks for both apps and the Node test suites of the Android app's logic (photo backup, photo vault, ...).
# Releases are still built by hand: the Android signing key never leaves the owner's PC.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      # The tests bundle the app's code with the desktop project's esbuild.
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: mobile
      - run: npx tsc --noEmit -p .
        working-directory: mobile
      - run: npm test
        working-directory: mobile

  # The Wear OS app: its unit tests, which include the watch's link against the phone app's real watch-link code (run
  # under Node, bundled with the repository's esbuild) and a picture of every screen. No signing key here: the build
  # falls back to the debug key, which is all a test run needs.
  wear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: chmod +x gradlew
        working-directory: wear
      - run: ./gradlew testDebugUnitTest :app:assembleDebug
        working-directory: wear

  # The Rust rewrite (docs/rust-rewrite.md): formatting, lints and tests of the whole Cargo workspace.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      # Slint's desktop backend links against fontconfig and xkbcommon.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      # --all-features: hub-net's real HTTP transport is an optional feature.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
