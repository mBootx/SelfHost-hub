<svg xmlns="http://www.w3.org/2000/svg" viewBox="165 191 228 246" width="228" height="246">
  <title>SelfHost Hub</title>
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0" stop-color="#1b2721"/>
      <stop offset="1" stop-color="#090c0b"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="256" cy="256" r="235">
      <stop offset="0" stop-color="#1DB954" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#1DB954" stop-opacity="0"/>
    </radialGradient>
    <!-- One gradient across the whole emblem, so the triangle and the nodes share the same light. -->
    <linearGradient id="green" gradientUnits="userSpaceOnUse" x1="181" y1="207" x2="377" y2="421">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="0.55" stop-color="#1DB954"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <!-- Punches the centre out of each node, so they read as ports on the hub. -->
    <mask id="holes" maskUnits="userSpaceOnUse" x="-128" y="-128" width="768" height="768">
      <rect x="-128" y="-128" width="768" height="768" fill="#fff"/>
      <circle cx="212" cy="238" r="11" fill="#000"/>
      <circle cx="346" cy="314" r="11" fill="#000"/>
      <circle cx="212" cy="390" r="11" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#holes)">
    <!-- Play button drawn as a hub: three linked nodes for music, files and downloads -->
    <path d="M212 238 L346 314 L212 390 Z" fill="url(#green)" fill-opacity="0.14" stroke="url(#green)" stroke-width="24" stroke-linejoin="round"/>
    <circle cx="212" cy="238" r="31" fill="url(#green)"/>
    <circle cx="346" cy="314" r="31" fill="url(#green)"/>
    <circle cx="212" cy="390" r="31" fill="url(#green)"/>
  </g>
</svg>
