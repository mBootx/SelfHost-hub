[package]
name = "hub-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
hub-core = { version = "0.1.0", path = "../hub-core" }
hub-net = { version = "0.1.0", path = "../hub-net" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }

[lints]
workspace = true

[dev-dependencies]
hub-net = { path = "../hub-net", features = ["fake"] }
tokio = { version = "1.54.1", features = ["rt", "macros"] }
