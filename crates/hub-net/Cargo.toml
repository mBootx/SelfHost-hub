[package]
name = "hub-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
hub-core = { version = "0.1.0", path = "../hub-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"], optional = true }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }

[lints]
workspace = true

[features]
# The real HTTP transport (reqwest, rustls on ring, the platform's certificate store). Off by default so the
# protocol code and its tests build without it; the apps turn it on.
http = ["dep:reqwest", "dep:rustls"]
# The in-memory Navidrome (`subsonic::fake`), for the tests of the crates built on this one.
fake = []
